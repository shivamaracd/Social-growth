<section class="carousel-section">
  <div class="carousel-container">
    <!-- Slides -->
    <div class="slides">
      <div 
        *ngFor="let slide of slides; let i = index" 
        class="slide" 
        [class.active]="i === currentSlide"
        [class.gradient-youtube]="slide.gradient === 'youtube'"
        [class.gradient-facebook]="slide.gradient === 'facebook'"
        [class.gradient-instagram]="slide.gradient === 'instagram'">
        <div class="container">
          <div class="row align-items-center">
            <div class="col-lg-6 content-col">
              <div class="slide-content">
                <div class="platform-badge">
                  <i class="bi" [ngClass]="slide.icon"></i>
                  <span>{{slide.platform}}</span>
                </div>
                <h1 class="slide-title">{{slide.title}}</h1>
                <p class="slide-subtitle">{{slide.subtitle}}</p>
                <p class="slide-description">{{slide.description}}</p>
                <div class="slide-actions">
                  <a routerLink="/register" class="btn btn-outline btn-lg me-3">
                    <i class="bi bi-person-plus me-2"></i>Register Now
                  </a>
                  <a routerLink="/login" class="btn btn-secondary btn-lg">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Login
                  </a>
                </div>
              </div>
            </div>
            <div class="col-lg-6 icon-col">
              <div class="slide-icon">
                <i class="bi" [ngClass]="slide.icon"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Navigation Arrows -->
    <button class="nav-arrow prev" (click)="prevSlide()">
      <i class="bi bi-chevron-left"></i>
    </button>
    <button class="nav-arrow next" (click)="nextSlide()">
      <i class="bi bi-chevron-right"></i>
    </button>

    <!-- Indicators -->
    <div class="indicators">
      <button 
        *ngFor="let slide of slides; let i = index" 
        class="indicator" 
        [class.active]="i === currentSlide"
        (click)="goToSlide(i)">
      </button>
    </div>
  </div>
</section>
