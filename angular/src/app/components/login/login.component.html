<div class="login-page">
  <div class="container">
    <div class="row justify-content-center align-items-center">
      <div class="col-lg-5 col-md-7">
        <div class="login-card">
          <div class="login-header">
            <div class="logo">
              <i class="bi bi-rocket-takeoff"></i>
            </div>
            <h2>Welcome Back!</h2>
            <p>Sign in to continue your growth journey</p>
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
            <!-- Email -->
            <div class="form-group">
              <label for="email">
                <i class="bi bi-envelope"></i>
                Email Address
              </label>
              <input 
                type="email" 
                id="email"
                formControlName="email"
                class="form-control"
                [class.is-invalid]="f['email'].invalid && f['email'].touched"
                placeholder="Enter your email"
                autofocus>
              <div class="invalid-feedback" *ngIf="f['email'].invalid && f['email'].touched">
                <span *ngIf="f['email'].errors?.['required']">Email is required</span>
                <span *ngIf="f['email'].errors?.['email']">Please enter a valid email</span>
              </div>
            </div>

            <!-- Password -->
            <div class="form-group">
              <label for="password">
                <i class="bi bi-lock"></i>
                Password
              </label>
              <div class="password-input-wrapper">
                <input 
                  [type]="showPassword ? 'text' : 'password'" 
                  id="password"
                  formControlName="password"
                  class="form-control"
                  [class.is-invalid]="f['password'].invalid && f['password'].touched"
                  placeholder="Enter your password">
                <button 
                  type="button" 
                  class="password-toggle"
                  (click)="togglePasswordVisibility()">
                  <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                </button>
              </div>
              <div class="invalid-feedback" *ngIf="f['password'].invalid && f['password'].touched">
                <span *ngIf="f['password'].errors?.['required']">Password is required</span>
              </div>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="form-options">
              <div class="form-check-custom">
                <input 
                  type="checkbox" 
                  id="rememberMe"
                  formControlName="rememberMe"
                  class="form-check-input">
                <label for="rememberMe" class="form-check-label">
                  Remember me
                </label>
              </div>
              <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <!-- Submit Button -->
            <button 
              type="submit" 
              class="btn btn-primary btn-lg w-100"
              [disabled]="isSubmitting">
              <span *ngIf="!isSubmitting">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
              </span>
              <span *ngIf="isSubmitting">
                <span class="spinner-border spinner-border-sm me-2"></span>
                Signing In...
              </span>
            </button>
          </form>

          <!-- Social Login -->
          <div class="divider">
            <span>Or continue with</span>
          </div>

          <div class="social-login">
            <button class="social-btn google-btn">
              <i class="bi bi-google"></i>
              Google
            </button>
            <button class="social-btn facebook-btn">
              <i class="bi bi-facebook"></i>
              Facebook
            </button>
          </div>

          <div class="login-footer">
            <p>Don't have an account? <a routerLink="/register">Create Account</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
